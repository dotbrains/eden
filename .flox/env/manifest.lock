    "vars": {
      "EDEN_PYTHON": "python3.11"
    },
    "hook": {
      "on-activate": "  cd \"$FLOX_ENV_PROJECT\" || exit 1\n  PYBIN=\"${EDEN_PYTHON:-python3.11}\"\n  STAMP=\".venv/.eden-deps-stamp\"\n\n  # (Re)create the venv if it is missing or its interpreter is broken.\n  if [ ! -x .venv/bin/python ] || ! .venv/bin/python -c 'import sys' 2>/dev/null; then\n    \"$PYBIN\" -m venv .venv\n    rm -f \"$STAMP\"\n  fi\n\n  # Reinstall deps only when pyproject.toml is newer than the stamp, so\n  # repeat activations stay fast.\n  if [ ! -f \"$STAMP\" ] || [ pyproject.toml -nt \"$STAMP\" ]; then\n    .venv/bin/python -m pip install --upgrade pip >/dev/null\n    .venv/bin/python -m pip install -e \".[dev]\" >/dev/null\n    touch \"$STAMP\"\n  fi\n\n  # Put the venv on PATH here (not just in [profile]): the hook runs for\n  # both interactive `flox activate` and non-interactive\n  # `flox activate -- <cmd>` (used in CI), whereas [profile] only runs for\n  # interactive shells.\n  export VIRTUAL_ENV=\"$FLOX_ENV_PROJECT/.venv\"\n  export PATH=\"$VIRTUAL_ENV/bin:$PATH\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    }
