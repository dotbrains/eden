name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Canonical gate: static checks once, then the default test suite once with
  # coverage. Keep compatibility jobs unit-only so e2e and coverage are not
  # repeated across every Python/platform leg.
  check:
    name: check (py3.11, quality + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: pre-commit + pytest (unit + e2e, coverage)
        uses: ./.github/actions/flox-command
        with:
          command: >-
            bash -lc 'pre-commit run --all-files --show-diff-on-failure &&
            pytest -v -m "unit or e2e" --cov=eden --cov-fail-under=70'

  # Python 3.12 compatibility runs on Linux only. Python 3.13 is covered by
  # the macOS/Windows unit legs plus the Linux integration leg, so keep it out
  # of this job to avoid another duplicate unit run.
  test-linux-compat:
    name: test-linux-compat (py3.12)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: pytest (unit)
        uses: ./.github/actions/flox-command
        with:
          eden-python: python3.12
          command: pytest -v -m unit

  # macOS catches platform-specific path/process behavior with unit tests only;
  # Linux owns the e2e and coverage gates.
  test-macos:
    name: test-macos (py3.13)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: pytest (unit)
        uses: ./.github/actions/flox-command
        with:
          eden-python: python3.13
          command: pytest -v -m unit

  # Flox is Linux/macOS only, but eden ships Windows-specific path handling.
  # This leg stays native and runs unit tests only; Linux owns e2e coverage.
  test-windows:
    name: test-windows (py3.13)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest (unit)
        run: pytest -v -m unit

  # Real provider tests are Linux-only and heavily capability-gated. Run them
  # once instead of once per Python version.
  integration:
    name: integration (py3.13)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: pytest (integration)
        uses: ./.github/actions/flox-command
        with:
          eden-python: python3.13
          command: pytest -v -m integration
