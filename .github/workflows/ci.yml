name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks are Python-version independent: ruff is pinned in
  # pyproject.toml and mypy is configured for Python 3.11. Run them once.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDEN_PYTHON: python3.11
    steps:
      - uses: actions/checkout@v5

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Run pre-commit hooks (ruff format + lint, mypy --strict)
        run: flox activate -- pre-commit run --all-files --show-diff-on-failure

  # Run the full default suite once with coverage. The e2e tests exercise
  # orchestration behavior, so avoid repeating them across every Python leg.
  test-linux:
    name: test-linux (py3.11, coverage)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDEN_PYTHON: python3.11
    steps:
      - uses: actions/checkout@v5

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: pytest (unit + e2e, coverage)
        run: flox activate -- pytest -v -m "unit or e2e" --cov=eden --cov-fail-under=70

  # Compatibility legs keep the supported-Python matrix on Linux without
  # duplicating the e2e suite or coverage collection.
  test-linux-compat:
    name: test-linux-compat (py${{ matrix.python }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      EDEN_PYTHON: python${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: pytest (unit)
        run: flox activate -- pytest -v -m unit

  # macOS catches platform-specific path/process behavior; one current
  # Python leg avoids duplicating Linux's interpreter matrix.
  test-macos:
    name: test-macos (py3.13)
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      EDEN_PYTHON: python3.13
    steps:
      - uses: actions/checkout@v5

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: pytest (unit + e2e)
        run: flox activate -- pytest -v -m "unit or e2e"

  # Flox is Linux/macOS only, but eden ships Windows-specific path handling.
  # This leg stays native and uses one current Python to avoid duplicating
  # Linux's interpreter matrix.
  test-windows:
    name: test-windows (py3.13)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest (unit + e2e)
        run: pytest -v -m "unit or e2e"

  # Real provider tests are Linux-only and heavily capability-gated. Run them
  # once instead of once per Python version.
  integration:
    name: integration (py3.13)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDEN_PYTHON: python3.13
    steps:
      - uses: actions/checkout@v5

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: pytest (integration)
        run: flox activate -- pytest -v -m integration
