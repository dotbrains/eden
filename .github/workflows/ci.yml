name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Canonical gate: static checks once, then the default test suite once with
  # coverage. Keep compatibility jobs unit-only so e2e and coverage are not
  # repeated across every Python/platform leg.
  check:
    name: check (py3.11, quality + coverage)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: pre-commit + pytest (unit + e2e, coverage)
        uses: ./.github/actions/flox-command
        with:
          command: |
            pre-commit run --all-files --show-diff-on-failure
            pytest -v -m "unit or e2e" --cov=eden --cov-fail-under=70

  # Package build is checked once so release packaging failures are caught
  # before tag publish.
  build:
    name: build (py3.11)
    needs: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: python -m build
        uses: ./.github/actions/flox-command
        with:
          command: python -m build

  # Compatibility matrix keeps each remaining runtime/platform concern to one
  # unit-only leg. Linux owns e2e and coverage in the canonical gate.
  test-compat:
    name: test-compat (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux py3.12
            os: blacksmith-2vcpu-ubuntu-2404
            eden-python: python3.12
            setup: flox
          - name: macos py3.13
            os: blacksmith-6vcpu-macos-latest
            eden-python: python3.13
            setup: flox
          - name: windows py3.13
            os: blacksmith-2vcpu-windows-2025
            python-version: "3.13"
            setup: pip
    steps:
      - uses: actions/checkout@v5

      - name: pytest (unit, Flox)
        if: matrix.setup == 'flox'
        uses: ./.github/actions/flox-command
        with:
          eden-python: ${{ matrix.eden-python }}
          command: pytest -v -m unit

      - name: Set up Python 3.13
        if: matrix.setup == 'pip'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        if: matrix.setup == 'pip'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest (unit, pip)
        if: matrix.setup == 'pip'
        run: pytest -v -m unit

  # Real provider tests are Linux-only and heavily capability-gated. Run them
  # once instead of once per Python version.
  integration:
    name: integration (py3.13)
    needs: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: pytest (integration)
        uses: ./.github/actions/flox-command
        with:
          eden-python: python3.13
          command: pytest -v -m integration
