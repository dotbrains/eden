# Run on every commit:
#
#   pip install -e ".[dev]"   # one-time, gives you pre-commit + pinned mypy
#   pre-commit install        # one-time, wires the git hook
#
# Ruff hooks use astral-sh/ruff-pre-commit so they install ruff into an
# isolated env — the hooks fire correctly even when your venv is not
# activated. Bump `rev:` in lockstep with the `ruff==…` pin in pyproject.toml's
# [dev] extras (single source of truth: bump both, the version is duplicated
# only because pre-commit needs the version inline to provision its env).
#
# The mypy hook uses `language: system` so it picks up the active venv's
# installed dependencies (typer, rich, requests, opentelemetry, …) —
# pre-commit cannot easily replicate the project's full transitive dependency
# tree inside an isolated env. `scripts/precommit_mypy.py` locates the
# project's mypy in `.venv/bin/mypy` (POSIX) or `.venv\Scripts\mypy.exe`
# (Windows) and falls back to `mypy` on PATH for CI, so `git commit` works
# without activating the venv first.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
        # Match `ruff format --check eden tests` in CI scope.
        args: [eden, tests]
        pass_filenames: false
      - id: ruff-check
        args: [--fix, eden, tests]
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: python3 scripts/precommit_mypy.py --strict
        language: system
        types: [python]
        pass_filenames: false
        args: [eden, tests]
      - id: loc-budget
        name: LOC budgets
        entry: python3 scripts/check_loc_budget.py
        language: system
        pass_filenames: false
