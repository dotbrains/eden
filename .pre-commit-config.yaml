# Run on every commit:
#
#   pip install -e ".[dev]"   # one-time, gives you pre-commit + pinned tools
#   pre-commit install        # one-time, wires the git hook
#
# All hooks are `repo: local` so the venv's pinned ruff/mypy are the single
# source of truth — no second tool-version list to keep in sync.

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
        # ruff format scans the whole tree quickly; pass the dirs explicitly so
        # the hook gates the same scope as `ruff format --check eden tests` in CI.
        pass_filenames: false
        args: [eden, tests]

      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        args: [eden, tests]

      - id: mypy
        name: mypy --strict
        entry: mypy --strict
        language: system
        types: [python]
        pass_filenames: false
        # mypy is incremental; keep it scoped to the same dirs CI checks.
        args: [eden, tests]
